name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v3

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Run Benchmarks
        run: python3 scripts/run_benchmarks.py --build-dir build --output build/results.json

      - name: Performance Regression Validation
        run: python3 scripts/compare_benchmarks.py --current build/results.json --baseline benchmarks/baselines/baseline.json --threshold 50

